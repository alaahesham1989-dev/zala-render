name: ZALA Arabic prep (facts, script, Egyptian Arabic voice direction)

# Prepares an Arabic Short before arabic.yml renders it: Wikipedia facts, then an original 60-second Egyptian
# Arabic script from arabic-treasures.json (or a translation of an English short when source is set), checked
# line by line by an editor. arabic.yml only takes a topic whose content/youtube/<id>.json already exists here —
# the two are separate stages, same split as prep.yml -> factory.yml for the English line.
on:
  workflow_dispatch:
    inputs:
      arabic_id:
        description: "Arabic topic id from arabic-treasures.json (e.g. ZV-AR01) — ORIGINAL mode. Empty = the next one not prepared yet"
        required: false
        default: ""
        type: string
      source:
        description: "English short id or title words — TRANSLATE mode (leave empty for original)"
        required: false
        default: ""
        type: string
      voice:
        description: "Gemini voice"
        required: false
        default: Orus
        type: string
      force:
        description: "Write the script again even if it is already prepared"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: zala-arabic-prep
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # the Arabic machine has its own Gemini quota (GEMINI_API_KEY_AR); until that secret exists it borrows the shared keys
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AR != '' && secrets.GEMINI_API_KEY_AR || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_AR == '' && secrets.GEMINI_API_KEY_3 || '' }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEY_AR == '' && secrets.GEMINI_API_KEYS || '' }}
      ZALA_LINE: ar
      GEMINI_TEXT_MODELS: gemini-3.5-flash,gemini-3.8-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TG_CHAT_AR || secrets.TELEGRAM_CHAT_ID }}
      E: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bring scripts and facts from R2
        run: |
          aws s3 sync "s3://${R2_BUCKET}/render-state/content" content --endpoint-url "$E" --no-progress --exclude "*" --include "youtube/*" --include "factbank/*" --include "library/items.jsonl"
          aws s3 sync "s3://${R2_BUCKET}/render-state-ar/content" content --endpoint-url "$E" --no-progress --exclude "*" --include "youtube/*" --include "factbank/*" || true   # this machine's own scripts on top
      - name: Which topic
        run: |
          ID="${{ inputs.arabic_id }}"
          if [ -z "$ID" ] && [ -z "${{ inputs.source }}" ]; then
            for t in $(node -e 'console.log(Object.keys(require("./media/tools/arabic-treasures.json")).join(" "))'); do
              [ -f "content/youtube/$t.json" ] || { ID="$t"; break; }
            done
          fi
          echo "ID=$ID" >> "$GITHUB_ENV"
          echo "To prepare: ${ID:-${{ inputs.source }}}"
          if [ "${{ inputs.force }}" = "true" ] && [ -n "$ID" ]; then rm -f "content/youtube/$ID.json"; echo "force: cleared the saved script"; fi
      - name: Prepare
        if: env.ID != '' || inputs.source != ''
        run: |
          set -uo pipefail
          ok=no
          for i in 1 2 3; do
            if [ -n "${{ inputs.source }}" ]; then node media/tools/arabic.mjs "${{ inputs.source }}" "${{ inputs.voice }}" && { ok=yes; break; }
            else node media/tools/arabic-prep.mjs "$ID" "${{ inputs.voice }}" && { ok=yes; break; }; fi
            echo "prep: Gemini busy, waiting 5 minutes"; sleep 300
          done
          [ $ok = yes ]
      - name: Save back to R2
        if: always() && (env.ID != '' || inputs.source != '')
        run: |
          for d in youtube factbank; do [ -d "content/$d" ] && aws s3 sync "content/$d" "s3://${R2_BUCKET}/render-state-ar/content/$d" --endpoint-url "$E" --no-progress --exclude "*" --include "ZV-AR*" --include "zv-ar*"; done
      - name: Telegram (quiet status, same as prep.yml)
        if: always() && (env.ID != '' || inputs.source != '')
        run: |
          if [ -f "content/youtube/${ID:-x}.json" ]; then MSG=""
          else MSG="ZALA عربي - تحضير: ${ID:-${{ inputs.source }}} فشل، شوف السجل."; fi
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ] && [ -n "${MSG:-}" ]; then curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true; fi
