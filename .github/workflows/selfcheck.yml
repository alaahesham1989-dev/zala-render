name: ZALA self-check (workflow files are valid)

# Catches exactly the bug that broke episode prep for a whole day (2026-11-13/14, an unquoted colon in a step
# name): a workflow file with invalid YAML never runs at all, on its schedule or by hand, and GitHub shows that
# as a silent "failure" with zero steps — easy to miss. This runs on every push that touches a workflow file,
# and once a day as a backup, and tells Telegram the moment one is broken, instead of someone noticing days later.
on:
  push:
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate every workflow file's YAML
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import sys, os, yaml
          bad = []
          d = ".github/workflows"
          for f in sorted(os.listdir(d)):
              if not f.endswith((".yml", ".yaml")):
                  continue
              p = os.path.join(d, f)
              try:
                  with open(p, "rb") as fh:
                      yaml.safe_load(fh.read())
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("BROKEN WORKFLOW FILES:")
              for b in bad:
                  print(" -", b)
              with open(os.environ["GITHUB_ENV"], "a") as g:
                  g.write("BAD=" + " | ".join(bad)[:1500].replace("\n", " ") + "\n")
              sys.exit(1)
          print("All workflow files are valid YAML.")
          PY
      - name: Telegram (only when something is actually broken)
        if: failure()
        run: |
          MSG="ZALA: ملف تشغيلة بايظ (YAML غلط) ومش هيشتغل خالص لحد ما يتصلح: ${BAD:-}"
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true; fi
