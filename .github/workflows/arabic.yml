name: ZALA Arabic Short (render + review only)

# Render + review stage only — a separate stage from prep, same split as prep.yml -> factory.yml for the
# English line. arabic-prep.yml writes content/youtube/<id>.json first (facts, script, editor pass); this
# workflow only takes a topic whose script already exists there, makes the video and checks it. It never
# writes a script itself and never publishes: the video goes to R2 and Telegram for the owner to watch first.
on:
  workflow_dispatch:
    inputs:
      arabic_id:
        description: "Arabic topic id already prepared by arabic-prep.yml (e.g. ZV-AR01, or the AR_ID: its translate mode wrote). Empty = the next prepared one not yet rendered"
        required: false
        default: ""
        type: string

concurrency:
  group: zala-arabic
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # the Arabic machine has its own Gemini quota (GEMINI_API_KEY_AR); until that secret exists it borrows the shared keys
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AR != '' && secrets.GEMINI_API_KEY_AR || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_AR == '' && secrets.GEMINI_API_KEY_3 || '' }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEY_AR == '' && secrets.GEMINI_API_KEYS || '' }}
      ZALA_LINE: ar
      GEMINI_TEXT_MODELS: gemini-3.5-flash,gemini-3.8-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      VITE_MEDIA_BASE_URL: ${{ secrets.VITE_MEDIA_BASE_URL }}
      META_COOKIES: ${{ secrets.META_COOKIES }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      CHROME_PATH: /usr/bin/google-chrome
      NO_ARABIC_COPY: "1"   # nobody reviews the Arabic copy any more: one full encode less per render
      GH_TOKEN: ${{ github.token }}
      MANIM_PY: /tmp/manim/bin/python
      E: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bring scripts, picture index and plans from R2
        run: |
          set -euo pipefail
          aws s3 sync "s3://${R2_BUCKET}/render-state/content" content --endpoint-url "$E" --no-progress   # the English machine's state: read only here
          aws s3 sync "s3://${R2_BUCKET}/render-state-ar/content" content --endpoint-url "$E" --no-progress || true   # this machine's own state on top
          git checkout -- content/meta-queue.json
          git checkout -- content/outbox.json 2>/dev/null || true   # the outbox list lives in git like the queue
          cp media/tools/treasures.json content/library/treasures.json
          node -e 'const fs=require("fs"); const t=JSON.parse(fs.readFileSync("content/library/treasures.json","utf8")); const a=JSON.parse(fs.readFileSync("media/tools/arabic-treasures.json","utf8")); Object.assign(t,a); fs.writeFileSync("content/library/treasures.json", JSON.stringify(t, null, 2));'
          sleep 2; touch /tmp/ar-start   # what the job writes after this moment is the Arabic machine's own state
      - name: Pick the topic (the clock starts this with no inputs; needs a script arabic-prep.yml already wrote)
        run: |
          set -uo pipefail
          ID="${{ inputs.arabic_id }}"
          if [ -z "$ID" ]; then
            for t in $(node -e 'console.log(Object.keys(require("./media/tools/arabic-treasures.json")).join(" "))'); do
              if [ -f "content/youtube/$t.json" ] && ! aws s3 ls "s3://${R2_BUCKET}/renders/$t/publish/" --endpoint-url "$E" | grep -q '\.mp4'; then ID="$t"; break; fi
            done
          fi
          echo "ID=$ID" >> "$GITHUB_ENV"
          echo "Today: ${ID:-nothing prepared yet — run arabic-prep.yml first}"
      - name: Install ffmpeg, fonts, drawing libraries and picture tools
        if: env.ID != ''
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core libcairo2-dev libpango1.0-dev pkg-config python3-dev
          sudo apt-get install -y fonts-noto-naskh-arabic 2>/dev/null || true
          cd media && npm ci && node tools/fetch-fonts.mjs && mkdir -p ~/.local/share/fonts && cp brand/fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f && cd ..
          python3 -m venv /tmp/whisper && /tmp/whisper/bin/pip install --quiet faster-whisper
          echo "WHISPER_PY=/tmp/whisper/bin/python" >> "$GITHUB_ENV"
          python3 -m venv /tmp/manim && /tmp/manim/bin/pip install --quiet "manim==0.18.1" "pillow==10.4.0"
          pip install --quiet pillow arabic-reshaper python-bidi
          python3 -m venv /tmp/lib && /tmp/lib/bin/pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          /tmp/lib/bin/pip install --quiet open_clip_torch transformers pillow
          for d in meta music; do aws s3 sync "s3://${R2_BUCKET}/render-cache/$d" "media/cache/$d" --endpoint-url "$E" --no-progress; done
          # only this topic's voice and half-made scenes, not every English episode's
          if [ -n "$ID" ]; then
            aws s3 sync "s3://${R2_BUCKET}/render-cache/voice/$ID" "media/cache/voice/$ID" --endpoint-url "$E" --no-progress || true
            aws s3 sync "s3://${R2_BUCKET}/render-cache/work/$ID" "media/tmp/render/$ID" --endpoint-url "$E" --no-progress || true
          fi
      - name: 1 — Make and check (no outbox, no publishing)
        if: env.ID != ''
        run: |
          set -uo pipefail
          exec > >(tee -a run.log) 2>&1
          pass=no
          for round in 1 2 3; do
            review=""; [ "$round" -gt 1 ] && { review="quality-$ID/verdict.json"; [ -f "quality-$ID/review.json" ] && review="quality-$ID/review.json"; }
            bash media/tools/line/make.sh "$ID" short "$review" || { echo "make stopped ($round)"; continue; }
            if bash media/tools/line/quality.sh "$ID" "quality-$ID"; then pass=yes; break; fi
            echo "QUALITY: $ID fixing (round $round)"
          done
          echo "PASS=$pass" >> "$GITHUB_ENV"
      - name: Save to R2 (preview only)
        if: always() && env.ID != ''
        run: |
          if [ -n "${ID:-}" ]; then
            if [ "${PASS:-no}" = yes ]; then aws s3 rm "s3://${R2_BUCKET}/render-cache/work/$ID" --recursive --endpoint-url "$E" --quiet || true
            elif [ -d "media/tmp/render/$ID" ]; then aws s3 sync "media/tmp/render/$ID" "s3://${R2_BUCKET}/render-cache/work/$ID" --endpoint-url "$E" --no-progress --exclude "*.ass" || true; fi
          fi
          if [ -f /tmp/ar-start ]; then mkdir -p /tmp/ar-out && (cd content && find . -type f -newer /tmp/ar-start ! -name outbox.json ! -name meta-queue.json -print0 | xargs -0 -r cp --parents -t /tmp/ar-out) && aws s3 sync /tmp/ar-out "s3://${R2_BUCKET}/render-state-ar/content" --endpoint-url "$E" --no-progress; fi   # only this machine's own files, into its own prefix
          for d in voice meta music; do [ -d "media/cache/$d" ] && aws s3 sync "media/cache/$d" "s3://${R2_BUCKET}/render-cache/$d" --endpoint-url "$E" --no-progress; done
          [ -n "${ID:-}" ] && [ -d "media/out/$ID" ] && aws s3 sync "media/out/$ID" "s3://${R2_BUCKET}/renders/$ID" --endpoint-url "$E" --no-progress
          [ -n "${ID:-}" ] && [ -d "quality-$ID" ] && aws s3 sync "quality-$ID" "s3://${R2_BUCKET}/renders/$ID/review" --endpoint-url "$E" --no-progress
          aws s3 cp run.log "s3://${R2_BUCKET}/renders/${ID:-arabic}/run.log" --endpoint-url "$E" --no-progress || true
      - name: Telegram (the video, for the owner to watch)
        if: always() && env.ID != ''
        run: |
          v=$(ls media/out/${ID:-x}/publish/*.mp4 2>/dev/null | head -1)
          cap="ZALA عربي: ${ID:-?} — الفحص: ${PASS:-no}. مش متجدول، مستني موافقتك."
          # a link to R2, not the raw file: sendVideo's upload refused one over Telegram's ~50MB bot limit (413)
          if [ -n "$v" ]; then link="${VITE_MEDIA_BASE_URL%/}/renders/${ID}/publish/$(basename "$v")"
            r=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode "text=$cap
          $link")
          else r=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode "text=$cap (مفيش فيديو، راجع السجل)"); fi
          echo "$r" | grep -o '"ok":[a-z]*'
          # on a refusal print Telegram's own reason too, not just true/false, so the next failure is not a guess
          echo "$r" | grep -q '"ok":true' || echo "Telegram said: $r"
