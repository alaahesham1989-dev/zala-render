name: ZALA world atlas - daily, until the free quota ends

on:
  workflow_dispatch:
    inputs:
      picture_limit:
        description: "places whose pictures are checked"
        required: false
        default: "300"
        type: string
      only:
        description: "check only these places (cc/slug ...), nothing else runs"
        required: false
        type: string
      review_limit:
        description: "texts to review before writing"
        required: false
        default: "900"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: zala-atlas-world-daily${{ inputs.only && '-only' || '' }}
  cancel-in-progress: false

jobs:
  pictures:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      E: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      GEMINI_API_KEY_ATLAS: ${{ secrets.GEMINI_API_KEY_ATLAS }}
      GEMINI_API_KEY_ATLAS_AUDIO: ${{ secrets.GEMINI_API_KEY_ATLAS_AUDIO }}
      PICTURE_LIMIT: ${{ inputs.picture_limit || '300' }}
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Look at the pictures
        run: python media/tools/atlas-picture-review.py | tee -a "$GITHUB_STEP_SUMMARY"

  review:
    needs: pictures
    if: ${{ always() && !inputs.only }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      E: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      GEMINI_API_KEY_ATLAS: ${{ secrets.GEMINI_API_KEY_ATLAS }}
      GEMINI_API_KEY_ATLAS_2: ${{ secrets.GEMINI_API_KEY_ATLAS_AUDIO }}
      REVIEW_LIMIT: ${{ inputs.review_limit || '900' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bring the tools from R2
        run: aws s3 sync "s3://${R2_BUCKET}/atlas-work/_site" site --endpoint-url "$E" --no-progress
      - name: Review the texts that nobody has checked yet
        run: |
          set -o pipefail
          python site/scripts/world_atlas/review_scripts.py | tee log.txt
          grep -E "^\[review\]" log.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish the countries that changed
        run: |
          for cc in $(grep -E "^TOUCHED" log.txt | cut -d' ' -f2-); do
            before=$(gh run list -w atlas-world.yml -L 1 --json databaseId --jq '.[0].databaseId // 0')
            gh workflow run atlas-world.yml -f cc="$cc" -f limit=0 >/dev/null
            id=$before
            for i in $(seq 1 30); do sleep 6; id=$(gh run list -w atlas-world.yml -L 1 --json databaseId --jq '.[0].databaseId // 0'); [ "$id" != "$before" ] && break; done
            while [ "$(gh run view "$id" --json status --jq .status)" != "completed" ]; do sleep 30; done
          done

  walk:
    needs: review
    if: ${{ always() && !inputs.only }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Country after country
        run: |
          ORDER="sa ae jo om qa kw bh lb tn ma dz iq mr tr fr it es gb gr de pt nl at ch us jp th mx my id vn in kr sg br ar pe cl co ca za ke tz et gh"
          for retry in no yes; do
            for cc in $ORDER; do
              before=$(gh run list -w atlas-world.yml -L 1 --json databaseId --jq '.[0].databaseId // 0')
              gh workflow run atlas-world.yml -f cc="$cc" -f retry_redo="$retry" >/dev/null
              id=$before
              for i in $(seq 1 30); do sleep 6; id=$(gh run list -w atlas-world.yml -L 1 --json databaseId --jq '.[0].databaseId // 0'); [ "$id" != "$before" ] && break; done
              [ "$id" = "$before" ] && { echo "$cc: could not start"; exit 1; }
              while [ "$(gh run view "$id" --json status --jq .status)" != "completed" ]; do sleep 60; done
              gh run view "$id" --log > log.txt || true
              line=$(grep -oE "\[scripts\] written [0-9]+, sent to redo [0-9]+" log.txt | tail -n 1 || true)
              echo "$cc retry=$retry: $(gh run view "$id" --json conclusion --jq .conclusion) $line" | tee -a "$GITHUB_STEP_SUMMARY"
              if grep -q "the quota is probably gone" log.txt; then echo "Quota used up for today." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
            done
          done
          echo "Every country was walked twice today." | tee -a "$GITHUB_STEP_SUMMARY"
