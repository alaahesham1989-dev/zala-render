name: Telegram chats the bot is in (prints ids and titles only)
on:
  push:
    branches: [tg-routing]
    paths: ['.github/workflows/tg-chats.yml']
jobs:
  chats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: List chats from the bot's recent updates
        run: |
          body=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=100&allowed_updates=%5B%22message%22,%22my_chat_member%22,%22channel_post%22%5D")
          echo "$body" | jq -r 'if .ok then "ok, updates: \(.result|length)" else "not ok: \(.description)" end'
          echo "$body" | jq -r '.result[]? | (.message // .my_chat_member // .channel_post // {}) | .chat? | select(. != null) | "\(.id) | \(.type) | \(.title // .username // .first_name)"' | sort -u