name: ZALA Meta

# Publishing to the ZALA VIP Facebook page and Instagram through the official Graph API, on the server.
# The clock (clock.yml) starts it the minute something in content/meta-queue.json is due; by hand it posts one video.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "queue = post what the schedule says is due; or an episode id to post one video now"
        required: true
        default: queue
        type: string
      which:
        description: "main, R1, R2 or R3"
        required: true
        default: main
        type: string
      to:
        description: "fb, ig or fb,ig"
        required: true
        default: fb,ig
        type: string

permissions:
  contents: write

concurrency:
  group: zala-meta
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODE: ${{ inputs.episode == 'queue' && 'queue' || 'one' }}
      META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Video tools for the full episode on Instagram
        if: env.MODE == 'one' && inputs.which == 'main' && contains(inputs.to, 'ig')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Bring the package text from R2 (no video files)
        run: |
          if [ "$MODE" = "one" ]; then eps="${{ inputs.episode }}"; else eps=$(node -e "const q=require('./content/meta-queue.json');console.log([...new Set(q.filter(x=>!x.done&&Date.parse(x.at)<=Date.now()).map(x=>x.episode))].join(' '))"); fi
          for ep in $eps; do
            mkdir -p "publish/$ep"
            # one missing package must not stop the others: that item is reported and the rest of the queue goes out
            aws s3 cp "s3://${R2_BUCKET}/renders/${ep}/publish/${ep}.youtube.json" "publish/$ep/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress \
              || aws s3 cp "s3://${R2_BUCKET}/outbox/${ep}/${ep}.youtube.json" "publish/$ep/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress \
              || echo "no package for $ep"
          done
      - name: Publish one
        if: env.MODE == 'one'
        run: node media/tools/meta-publish.mjs "publish/${{ inputs.episode }}" "${{ inputs.episode }}" "${{ inputs.which }}" --to "${{ inputs.to }}"
      - name: Publish what is due
        if: env.MODE == 'queue'
        run: |
          rc=0
          node media/tools/meta-publish.mjs --queue content/meta-queue.json | tee meta.log || rc=$?
          # saved even when the publisher stopped half way: what did go out is never posted twice
          node media/tools/state-save.mjs "meta: published queued items" content/meta-queue.json
          failed=$(node -e "const q=require('./content/meta-queue.json');console.log(q.filter(x=>x.failed&&Date.parse(x.done)>Date.now()-3600e3).map(x=>x.episode+' '+x.which+' ('+x.failed.join('+')+')').join(', '))")
          if [ -n "$failed" ] && [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode "text=ZALA النشر: محتاج نظرة، اتجرب 3 مرات وما نزلش: $failed" >/dev/null || true
          fi
          exit $rc
