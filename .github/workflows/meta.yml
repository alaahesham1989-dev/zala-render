name: ZALA Meta

# Publishing to the ZALA VIP Facebook page and Instagram through the official Graph API, on the server.
# Run by hand for one video, or every hour for what content/meta-queue.json says is due.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "queue = post what the schedule says is due (waits up to 5 hours); or an episode id to post one video now"
        required: true
        default: queue
        type: string
      which:
        description: "main, R1, R2 or R3"
        required: true
        default: main
        type: string
      to:
        description: "fb, ig or fb,ig"
        required: true
        default: fb,ig
        type: string
  schedule:
    - cron: "*/20 * * * *"
    # GitHub often runs the 20-minute timer hours late. These early runs wait on the server until the next post is due,
    # so posts go out on time even when the timer is lazy.
    - cron: "0 9 * * *"
    - cron: "0 11 * * *"
    - cron: "30 13 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: zala-meta
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODE: ${{ (github.event_name == 'schedule' || inputs.episode == 'queue') && 'queue' || 'one' }}
      META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Watchdog (GitHub sometimes skips a daily schedule; start it if it has not run today)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%Y-%m-%d); hour=$(date -u +%H)
          # one waiting run per group: a new start would push out a waiting one, so only start when nothing waits
          waiting=0; for w in shorts.yml prep.yml factory.yml; do k=$(gh run list -R "$GITHUB_REPOSITORY" -w $w -L 5 --json status --jq '[.[]|select(.status=="queued" or .status=="pending" or .status=="waiting")]|length' || echo 1); waiting=$((waiting+k)); done
          [ "$waiting" -gt 0 ] && { echo "watchdog: a run is waiting already"; exit 0; }
          for w in "shorts.yml 03" "factory.yml 07"; do
            set -- $w
            [ "$hour" -lt "$2" ] && continue
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w "$1" -L 20 --json createdAt --jq "[.[]|select(.createdAt>=\"$today\")]|length" || echo 1)
            if [ "$n" = "0" ]; then echo "watchdog: $1 did not run today, starting it"; gh workflow run "$1" -R "$GITHUB_REPOSITORY" || true; break; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait on the server for the next post that is due within 5 hours
        if: env.MODE == 'queue'
        run: |
          s=$(node -e "const q=require('./content/meta-queue.json');const n=Date.now();const due=q.some(x=>!x.done&&Date.parse(x.at)<=n);const w=q.filter(x=>!x.done).map(x=>Date.parse(x.at)-n).filter(d=>d>0&&d<5*3600e3).sort((a,b)=>a-b)[0];console.log(!due&&w?Math.ceil(w/1000)+30:0)")
          echo "waiting $s seconds"; if [ "$s" -gt 0 ]; then sleep "$s"; git pull -q --rebase || true; fi
      - name: Video tools for the full episode on Instagram
        if: env.MODE == 'one' && inputs.which == 'main' && contains(inputs.to, 'ig')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Bring the package text from R2 (no video files)
        run: |
          set -euo pipefail
          if [ "$MODE" = "one" ]; then eps="${{ inputs.episode }}"; else eps=$(node -e "const q=require('./content/meta-queue.json');console.log([...new Set(q.filter(x=>!x.done&&Date.parse(x.at)<=Date.now()).map(x=>x.episode))].join(' '))"); fi
          for ep in $eps; do
            mkdir -p "publish/$ep"
            aws s3 cp "s3://${R2_BUCKET}/renders/${ep}/publish/${ep}.youtube.json" "publish/$ep/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
          done
      - name: Publish one
        if: env.MODE == 'one'
        run: node media/tools/meta-publish.mjs "publish/${{ inputs.episode }}" "${{ inputs.episode }}" "${{ inputs.which }}" --to "${{ inputs.to }}"
      - name: Publish what is due
        if: env.MODE == 'queue'
        run: |
          set -euo pipefail
          node media/tools/meta-publish.mjs --queue content/meta-queue.json
          if ! git diff --quiet content/meta-queue.json; then
            git config user.name "zala-bot"
            git config user.email "zala-bot@users.noreply.github.com"
            git add -f content/meta-queue.json
            git commit -m "meta: published queued items"
            git push
          fi
