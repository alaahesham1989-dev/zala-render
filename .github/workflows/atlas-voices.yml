name: ZALA atlas voices - ten places a day, checked by listening

on:
  workflow_dispatch:
    inputs:
      places:
        description: "how many places (both languages each)"
        required: false
        default: "10"
        type: string
      audit:
        description: "how many older voices to listen to"
        required: false
        default: "40"
        type: string

permissions:
  contents: read

concurrency:
  group: zala-atlas-voices
  cancel-in-progress: false

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      VOICE_PLACES: ${{ inputs.places }}
      AUDIT_LIMIT: ${{ inputs.audit }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      E: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      GEMINI_API_KEY_ATLAS_AUDIO: ${{ secrets.GEMINI_API_KEY_ATLAS_AUDIO }}
      GEMINI_API_KEY_ATLAS: ${{ secrets.GEMINI_API_KEY_ATLAS }}
      ATLAS_VOICE_AR: ${{ vars.ATLAS_VOICE_AR }}
      ATLAS_VOICE_EN: ${{ vars.ATLAS_VOICE_EN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Make, listen, publish
        run: python3 media/tools/atlas-voice-batch.py | tee -a "$GITHUB_STEP_SUMMARY"
