name: ZALA episode v2 (gap fill)

# A trial line next to "ZALA episode": the same render, plus media/tools/gapfill.mjs between the director and the pictures,
# so no line borrows a wrong picture. It never runs on a schedule and never changes the old workflow.
# No paid service: library pictures, Pixabay (free key), and Manim title scenes drawn on this server.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode id, e.g. ZV-L08 (the director must have run on it before)"
        required: true
        default: ZV-L08
        type: string
      meta:
        description: "Animate wide pictures with Meta AI in the background browser (yes or no)"
        required: false
        default: "yes"
        type: string

concurrency:
  group: zala-episode
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      EP: ${{ inputs.episode }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      VITE_MEDIA_BASE_URL: ${{ secrets.VITE_MEDIA_BASE_URL }}
      META_COOKIES: ${{ secrets.META_COOKIES }}
      CHROME_PATH: /usr/bin/google-chrome
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      MANIM_PY: /tmp/manim/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg, fonts and drawing libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core libcairo2-dev libpango1.0-dev pkg-config python3-dev
      - name: Install tools and fonts
        working-directory: media
        run: |
          npm ci
          node tools/fetch-fonts.mjs
          mkdir -p ~/.local/share/fonts && cp brand/fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f
      - name: Install word timing and Manim
        run: |
          python3 -m venv /tmp/whisper && /tmp/whisper/bin/pip install --quiet faster-whisper
          echo "WHISPER_PY=/tmp/whisper/bin/python" >> "$GITHUB_ENV"
          python3 -m venv /tmp/manim && /tmp/manim/bin/pip install --quiet "manim==0.18.1" "pillow==10.4.0"
      - name: Bring scripts, picture index and finished work from R2
        run: |
          set -euo pipefail
          E="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync "s3://${R2_BUCKET}/render-state/content" content --endpoint-url "$E" --no-progress
          for d in voice meta music; do aws s3 sync "s3://${R2_BUCKET}/render-cache/$d" "media/cache/$d" --endpoint-url "$E" --no-progress; done
          aws s3 sync "s3://${R2_BUCKET}/render-input/${EP}" "media/cache/narration/${EP}" --endpoint-url "$E" --no-progress
      - name: Fill the empty lines, then render
        run: |
          set -euo pipefail
          exec > >(tee -a run.log) 2>&1
          aws s3 cp "s3://${R2_BUCKET}/renders/${EP}/review/review.json" last-review.json --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress || true
          node media/tools/gapfill.mjs "$EP" --review last-review.json
          if [ "${{ inputs.meta }}" = "yes" ]; then node media/zala-render.mjs all "$EP"; else node media/zala-render.mjs all "$EP" --no-meta; fi
          node media/tools/review-render.mjs "media/out/${EP}/publish" "content/youtube/${EP}.json" review-out
          aws s3 sync review-out "s3://${R2_BUCKET}/renders/${EP}/review" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
      - name: Save work back to R2, even after a failure
        if: always()
        run: |
          E="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync content "s3://${R2_BUCKET}/render-state/content" --endpoint-url "$E" --no-progress
          for d in voice meta music; do [ -d "media/cache/$d" ] && aws s3 sync "media/cache/$d" "s3://${R2_BUCKET}/render-cache/$d" --endpoint-url "$E" --no-progress; done
          [ -d "media/out/$EP" ] && aws s3 sync "media/out/$EP" "s3://${R2_BUCKET}/renders/$EP" --endpoint-url "$E" --no-progress
          true
      - name: Update the preview page and tell the owner
        if: always()
        run: |
          E="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          node media/tools/preview-board.mjs preview.html && aws s3 cp preview.html "s3://${R2_BUCKET}/preview/index.html" --endpoint-url "$E" --content-type "text/html; charset=utf-8" --no-progress || true
          V=$(aws s3 cp "s3://${R2_BUCKET}/renders/${EP}/review/verdict.json" - --endpoint-url "$E" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const v=JSON.parse(s);console.log(v.pass?"الفحص عدّى":"الفحص وقف: "+(v.reasons||[]).slice(0,3).join(" | "))}catch{console.log("مفيش نتيجة فحص")}})')
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode "text=ZALA v2: $EP خلص (${{ job.status }}). $V" >/dev/null || true
          fi
