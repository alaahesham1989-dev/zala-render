name: ZALA keys check

# Checks that each free-service key answers. Prints only the HTTP status, never a key.
on: workflow_dispatch

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          c() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          pip -q install kaggle >/dev/null 2>&1; kaggle --version
          echo "KUSER len=${#KAGGLE_USERNAME} lower=$( [ "$KAGGLE_USERNAME" = "$(echo "$KAGGLE_USERNAME" | tr A-Z a-z | tr -d ' ')" ] && echo yes || echo no) KEY len=${#KAGGLE_KEY}"
          echo "KAGGLE basic $(c -u "$KAGGLE_USERNAME:$KAGGLE_KEY" 'https://www.kaggle.com/api/v1/datasets/list?search=egypt') cli: $(kaggle datasets list -s egypt 2>&1 | head -2 | tr -s '[:space:]' ' ' | cut -c1-100)"
          echo "GROQ $(c -H "Authorization: Bearer $GROQ_API_KEY" https://api.groq.com/openai/v1/models)"
          echo "CF_TOKEN $(c -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          echo "CF_AI $(c -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/models/search?per_page=1")"
          echo "HF $( [ -n "$HF_TOKEN" ] && c -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2 || echo missing)"
