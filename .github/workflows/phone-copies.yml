name: ZALA phone copies (same 1080p, smaller download)
# A copy of a finished video for watching on a phone: same size picture, newer compression (H.265), audio untouched.
# The original is never changed.
on:
  push:
    branches: [phone-copies]
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        id: [ZV-ESL01, ZV-ENL01]
    env:
      ID: ${{ matrix.id }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      E: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - run: sudo apt-get update -y >/dev/null && sudo apt-get install -y ffmpeg >/dev/null
      - name: Encode, measure, keep
        run: |
          set -euo pipefail
          aws s3 cp "s3://${R2_BUCKET}/renders/$ID/publish/$ID.mp4" src.mp4 --endpoint-url "$E" --no-progress
          ffmpeg -v error -y -i src.mp4 -map 0:v:0 -map 0:a:0 -c:v libx265 -preset medium -crf 22 -pix_fmt yuv420p -tag:v hvc1 -x265-params log-level=error -c:a copy -movflags +faststart phone.mp4
          for at in 60 400 700; do
            s=$(ffmpeg -v info -ss $at -t 20 -i phone.mp4 -ss $at -t 20 -i src.mp4 -lavfi "[0:v][1:v]ssim" -an -f null - 2>&1 | grep -oE "All:[0-9.]+" | tail -1)
            echo "RESULT $ID ssim at ${at}s $s"
          done
          echo "RESULT $ID was=$(( $(stat -c%s src.mp4)/1000000 ))MB now=$(( $(stat -c%s phone.mp4)/1000000 ))MB seconds=$(ffprobe -v error -show_entries format=duration -of csv=p=0 phone.mp4)"
          aws s3 cp phone.mp4 "s3://${R2_BUCKET}/renders/$ID/phone/$ID.mp4" --endpoint-url "$E" --no-progress --content-type video/mp4
