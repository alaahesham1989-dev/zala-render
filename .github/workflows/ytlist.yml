name: ZALA YouTube list (what is public, private, scheduled)

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "which channel: en | ar | es"
        required: false
        default: "en"
        type: string
      brand:
        description: "add the channel identity (Ancient Egypt) to every title: dry | apply | no"
        required: false
        default: "no"
        type: string

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ inputs.lang == 'es' && (secrets.YOUTUBE_REFRESH_TOKEN_ES || 'missing') || inputs.lang == 'ar' && secrets.YOUTUBE_REFRESH_TOKEN_AR || secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node media/tools/youtube-list.mjs
      - if: inputs.lang != 'ar' && inputs.lang != 'es' && (inputs.brand == 'dry' || inputs.brand == 'apply')
        run: node media/tools/youtube-brand.mjs ${{ inputs.brand == 'dry' && '--dry' || '' }}
