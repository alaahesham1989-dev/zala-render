name: ZALA shorts (standalone, one topic each)

# Every day: three Shorts made from scratch, each its own topic (a mystery, strange daily life, a place from the
# ZALA Guide map), facts checked by an editor, its own small picture library, the director, the voice and a vertical
# render. Scheduled at 13:00, 19:00 and 23:30 UTC on YouTube, Facebook and Instagram, between the episodes.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many shorts"
        required: false
        default: "3"
      redo:
        description: "Make these scheduled shorts again (id:youtubeId, space separated), same publish time"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: zala-episode
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_TEXT_MODELS: gemini-3.5-flash,gemini-3.8-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      VITE_MEDIA_BASE_URL: ${{ secrets.VITE_MEDIA_BASE_URL }}
      META_COOKIES: ${{ secrets.META_COOKIES }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      CHROME_PATH: /usr/bin/google-chrome
      NO_ARABIC_COPY: "1"   # nobody reviews the Arabic copy any more: one full encode less per render
      GH_TOKEN: ${{ github.token }}
      MANIM_PY: /tmp/manim/bin/python
      E: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bring scripts, picture index and plans from R2
        run: |
          set -euo pipefail
          aws s3 sync "s3://${R2_BUCKET}/render-state/content" content --endpoint-url "$E" --no-progress
          git checkout -- content/meta-queue.json
          cp media/tools/treasures.json content/library/treasures.json
          echo "EP=shorts" >> "$GITHUB_ENV"
      - name: Install ffmpeg, fonts, drawing libraries and picture tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core libcairo2-dev libpango1.0-dev pkg-config python3-dev
          cd media && npm ci && node tools/fetch-fonts.mjs && mkdir -p ~/.local/share/fonts && cp brand/fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f && cd ..
          python3 -m venv /tmp/whisper && /tmp/whisper/bin/pip install --quiet faster-whisper
          echo "WHISPER_PY=/tmp/whisper/bin/python" >> "$GITHUB_ENV"
          python3 -m venv /tmp/manim && /tmp/manim/bin/pip install --quiet "manim==0.18.1" "pillow==10.4.0"
          python3 -m venv /tmp/lib && /tmp/lib/bin/pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          /tmp/lib/bin/pip install --quiet open_clip_torch transformers pillow
          for d in voice meta music; do aws s3 sync "s3://${R2_BUCKET}/render-cache/$d" "media/cache/$d" --endpoint-url "$E" --no-progress; done
          # carry on where the last run stopped: the scenes already rendered and the last review (only what it found is fixed)
          aws s3 sync "s3://${R2_BUCKET}/render-cache/work/$EP" "media/tmp/render/$EP" --endpoint-url "$E" --no-progress || true
          aws s3 cp "s3://${R2_BUCKET}/renders/$EP/review/review.json" review-last.json --endpoint-url "$E" --no-progress || true
          mkdir -p content/factbank && [ -f "media/tools/factbank-${EP}.json" ] && cp "media/tools/factbank-${EP}.json" "content/factbank/${EP,,}-facts.json" || true
      - name: Make the shorts
        run: |
          set -uo pipefail
          exec > >(tee -a run.log) 2>&1
          COUNT="${{ inputs.count }}"; COUNT="${COUNT:-3}"
          REDO="${{ inputs.redo }}"
          out=""
          if [ -z "$REDO" ]; then
            for i in 1 2 3; do out=$(node media/tools/shorts.mjs plan "$COUNT") && break; echo "plan: Gemini busy, waiting 5 minutes"; sleep 300; done
          fi
          echo "$out"
          ids=$(echo "$out" | grep -o 'SHORT_IDS:.*' | cut -d: -f2 || true)
          if [ -n "$REDO" ]; then ids=$(for p in $REDO; do echo -n "${p%%:*} "; done); fi
          made=""
          for id in $ids; do
            echo "=== $id"
            node media/tools/shorts.mjs restore "$id"
            /tmp/lib/bin/python media/tools/library_build.py "$id" --target 30 || { echo "$id: no library"; continue; }
            node media/tools/direct.mjs "$id" || { echo "$id: director stopped"; continue; }
            node media/zala-render.mjs all "$id" || { echo "$id: render stopped"; continue; }
            yt=""; for p in $REDO; do [ "${p%%:*}" = "$id" ] && yt="${p#*:}"; done
            if [ -n "$REDO" ]; then node media/tools/shorts.mjs package "$id" && node media/tools/shorts.mjs redo "$id" "$yt" && made="$made $id"
            else node media/tools/shorts.mjs package "$id" && node media/tools/shorts.mjs schedule "$id" && made="$made $id"; fi
          done
          echo "MADE=$made" >> "$GITHUB_ENV"
      - name: Save work back to R2 and the queue to git
        if: always()
        run: |
          aws s3 sync content "s3://${R2_BUCKET}/render-state/content" --endpoint-url "$E" --no-progress
          for d in voice meta music; do [ -d "media/cache/$d" ] && aws s3 sync "media/cache/$d" "s3://${R2_BUCKET}/render-cache/$d" --endpoint-url "$E" --no-progress; done
          for id in ${MADE:-}; do aws s3 sync "media/out/$id" "s3://${R2_BUCKET}/renders/$id" --endpoint-url "$E" --no-progress; done
          git config user.name "zala-bot"; git config user.email "zala-bot@users.noreply.github.com"
          git pull --rebase --autostash -q || true
          git add -f content/meta-queue.json content/shorts-state.json && git commit -qm "shorts: ${MADE:-none}" && git push -q || true
      - name: Telegram
        if: always()
        run: |
          n=$(echo ${MADE:-} | wc -w)
          MSG="ZALA الشورتس: اتعمل واتجدول $n شورت مستقل النهارده (كل واحد موضوع لوحده)."
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode "text=$MSG" >/dev/null || true; fi
