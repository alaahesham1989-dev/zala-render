name: ZALA episode

# Everything runs on this server: pictures go from their sources straight to R2, and the finished
# package goes to R2 (renders/<id>/). The owner's computer downloads and uploads nothing.
# Scripts, the picture index and facts live in R2 (render-state/), never in this public repository.
on:
  schedule:
    - cron: '30 8 * * *'   # 10:30 Cairo, after Gemini's free requests renew: finishes the episode, then keeps describing the library
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode id, e.g. ZV-L01"
        required: true
        default: ZV-L01
        type: string
      action:
        description: "What to run"
        required: true
        default: full-episode
        type: choice
        options: [full-episode, describe-library, meta-test, review, fetch-narration]
      voice_model:
        description: "Gemini voice model for the whole episode (empty = the usual one)"
        required: false
        type: string

concurrency:
  group: zala-episode
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      EP: ${{ inputs.episode || 'ZV-L01' }}
      ACTION: ${{ inputs.action || 'daily' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_TTS_MODEL: ${{ inputs.voice_model }}
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
      VITE_MEDIA_BASE_URL: ${{ secrets.VITE_MEDIA_BASE_URL }}
      META_COOKIES: ${{ secrets.META_COOKIES }}
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg and Arabic-capable fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core
          ffmpeg -hide_banner -filters | grep -E " (subtitles|drawtext|xfade|zoompan) "

      - name: Install tools and fonts
        working-directory: media
        run: |
          npm ci
          node tools/fetch-fonts.mjs

      - name: Install word timing
        run: |
          python3 -m venv /tmp/whisper
          /tmp/whisper/bin/pip install --quiet faster-whisper
          echo "WHISPER_PY=/tmp/whisper/bin/python" >> "$GITHUB_ENV"

      - name: Bring scripts, picture index, facts and finished work from R2
        run: |
          set -euo pipefail
          E="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync "s3://${R2_BUCKET}/render-state/content" content --endpoint-url "$E" --no-progress
          for d in voice meta music; do aws s3 sync "s3://${R2_BUCKET}/render-cache/$d" "media/cache/$d" --endpoint-url "$E" --no-progress; done
          aws s3 sync "s3://${R2_BUCKET}/render-input/${EP}" "media/cache/narration/${EP}" --endpoint-url "$E" --no-progress
          # narration links listed on R2 are fetched here, so the audio never passes through the owner's computer
          if [ -f "media/cache/narration/${EP}/sources.json" ] && [ ! -f "media/cache/narration/${EP}/chapter-1.mp3" ]; then
            node -e 'const fs=require("fs"),{execFileSync:x}=require("child_process"),d="media/cache/narration/"+process.env.EP;for(const [n,u] of Object.entries(JSON.parse(fs.readFileSync(d+"/sources.json"))))x("curl",["-sSfL","--retry","3","-o",d+"/chapter-"+n+".mp3",u]);'
            ls -la "media/cache/narration/${EP}"
            aws s3 sync "media/cache/narration/${EP}" "s3://${R2_BUCKET}/render-input/${EP}" --endpoint-url "$E" --no-progress
          fi

      - name: Run
        run: |
          if [ "$ACTION" = daily ]; then
            if aws s3 ls "s3://${R2_BUCKET}/renders/${EP}/" --recursive --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" | grep -q "_report.json"; then ACTION=describe-library; else ACTION=full-episode; fi
            echo "Today: $ACTION"
          fi
          case "$ACTION" in
            fetch-narration)
              # the server copies finished narrations from their links to R2; the owner's computer moves no audio
              E="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
              aws s3 cp "s3://${R2_BUCKET}/render-input/narration-sources.json" narration-sources.json --endpoint-url "$E" --no-progress
              node -e 'const fs=require("fs"),{execFileSync:x}=require("child_process");const all=JSON.parse(fs.readFileSync("narration-sources.json"));let bad=0,n=0;for(const [ep,parts] of Object.entries(all))for(const [name,url] of Object.entries(parts)){const d="narration-out/"+ep;fs.mkdirSync(d,{recursive:true});const out=d+"/"+name+".mp3";x("curl",["-sSfL","--retry","3","-o",out,url]);const sec=Number(x("ffprobe",["-v","error","-show_entries","format=duration","-of","csv=p=0",out],{encoding:"utf8"}));const mb=fs.statSync(out).size/1048576;console.log(ep,name,sec.toFixed(1)+"s",mb.toFixed(1)+"MB");n++;if(!(sec>30))bad++}console.log("fetched",n,"bad",bad);if(bad)process.exit(1)'
              for try in 1 2 3 4 5 6; do aws s3 sync narration-out "s3://${R2_BUCKET}/render-input" --endpoint-url "$E" --no-progress && { echo "saved on try $try"; break; }; [ "$try" = 6 ] && exit 1; sleep 20; done
              aws s3 ls "s3://${R2_BUCKET}/render-input/" --recursive --endpoint-url "$E" | grep part- | awk '{print $3, $4}'
              ;;
            review)
              E="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
              aws s3 sync "s3://${R2_BUCKET}/renders/${EP}/publish" "review-in" --endpoint-url "$E" --no-progress
              node media/tools/review-render.mjs review-in "content/youtube/${EP}.json" review-out
              aws s3 sync review-out "s3://${R2_BUCKET}/renders/${EP}/review" --endpoint-url "$E" --no-progress
              ;;
            full-episode)
              node media/library-harvest.mjs upload
              node media/library-harvest.mjs describe "$EP" --limit 400 --requests 5
              node media/library-harvest.mjs coverage
              node media/zala-render.mjs all "$EP" --no-meta
              E="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
              node media/tools/review-render.mjs "media/out/${EP}/publish" "content/youtube/${EP}.json" review-out
              aws s3 sync review-out "s3://${R2_BUCKET}/renders/${EP}/review" --endpoint-url "$E" --no-progress
              ;;
            describe-library)
              node media/library-harvest.mjs upload
              node media/library-harvest.mjs describe --limit 1500 --requests 20
              node media/library-harvest.mjs coverage
              ;;
            meta-test)
              node media/library-harvest.mjs upload
              node media/library-harvest.mjs describe "$EP" --limit 400 --requests 5
              node media/zala-render.mjs story "$EP"
              node media/zala-render.mjs images "$EP"
              node media/zala-render.mjs meta-test "$EP"
              ;;
          esac

      - name: Save work back to R2, even after a failure
        if: always()
        run: |
          E="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync content "s3://${R2_BUCKET}/render-state/content" --endpoint-url "$E" --no-progress --exclude "*" --include "library/*" --include "youtube/*"
          for d in voice meta music; do [ -d "media/cache/$d" ] && aws s3 sync "media/cache/$d" "s3://${R2_BUCKET}/render-cache/$d" --endpoint-url "$E" --no-progress; done
          [ -d "media/out/$EP" ] && aws s3 sync "media/out/$EP" "s3://${R2_BUCKET}/renders/$EP" --endpoint-url "$E" --no-progress
          echo "Finished files are in R2 under renders/$EP/" >> "$GITHUB_STEP_SUMMARY"
