name: ZALA picture post

# One picture post a day on Facebook and Instagram at 18:00 UTC (1pm US Eastern, inside the US audience's best
# afternoon window, noon to 6pm — owner's order 2026-11-13; was 15:00 UTC / 10am US Eastern, too early for them).
# GitHub's timer runs late, so two early runs wait on the server for 18:00; the second finds today done and stops.
# This workflow only PUBLISHES the next ready item from content/photo-queue.json — photo-prep.yml fills that
# queue ahead of time from our own checked episode stories, with a real photo already found and quality-checked.
on:
  schedule:
    - cron: "13 12 * * *"
    - cron: "37 14 * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Post now instead of waiting for 18:00 UTC"
        type: boolean
        default: false
      dry:
        description: "Quality check only, post nothing"
        type: boolean
        default: false
      force:
        description: "Post again even if one already went out today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zala-photo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      VITE_MEDIA_BASE_URL: ${{ secrets.VITE_MEDIA_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Already posted today?
        run: |
          d=$(node -e "const f='content/photo-posts.json';const s=require('fs').existsSync(f)?require('./'+f):[];console.log(s.some(x=>!x.refused&&String(x.at).slice(0,10)===new Date().toISOString().slice(0,10))?'yes':'no')")
          if [ "${{ inputs.dry }}" = "true" ] || [ "${{ inputs.force }}" = "true" ]; then d=no; fi   # a quality test, or an explicit extra post, runs any time
          echo "DONE_TODAY=$d" >> "$GITHUB_ENV"; echo "posted today: $d"
      - name: The episode schedule (so a post can link to its own video when one is already public)
        if: env.DONE_TODAY == 'no'
        run: aws s3 cp "s3://${R2_BUCKET}/render-state/content/schedule.json" content/schedule.json --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress || echo "no schedule yet"
      - name: Wait for 18:00 UTC
        if: env.DONE_TODAY == 'no' && !inputs.now
        run: |
          s=$(( $(date -u -d "18:00" +%s) - $(date -u +%s) )); echo "waiting $s seconds"
          if [ "$s" -gt 0 ] && [ "$s" -lt 19000 ]; then sleep "$s"; fi
      - name: Post
        if: env.DONE_TODAY == 'no'
        run: |
          node media/tools/photo-post.mjs ${{ inputs.dry && '--dry' || '' }}
          git config user.name "zala-bot"; git config user.email "zala-bot@users.noreply.github.com"
          git pull -q --rebase --autostash || true
          git add -f content/photo-posts.json content/photo-queue.json && git commit -qm "photo: daily picture post" && git push -q || echo "state push failed"
